<!DOCTYPE html>
<html>
<head>
    <title>Leave Application</title>        
</head>

<body>

<h1>Leave Application Form</h1>

<form id="leaveForm">

    <label>Employee Name:</label><br>
    <input type="text" id="employeeName">

    <br><br>

    <label>Position:</label><br>
    <input type="text" id="position">

    <br><br>

    <label>Leave Type:</label><br>
    <select id="leaveType">
        <option>Vacation Leave</option>
        <option>Sick Leave</option>
    </select>

    <br><br>

    <label>Start Date:</label><br>
    <input type="date" id="startDate">

    <br><br>

    <label>End Date:</label><br>
    <input type="date" id="endDate">

    <br><br>

    <label>Reason for Leave:</label><br>
    <textarea id="reason" rows="4" cols="40"></textarea>

    <br><br>

   

<button type="submit">Submit Application</button>
<button type="reset">Clear Form</button>

<br><br>

<button type="button" onclick="viewApplication()">
    View Saved Application
</button>

</form>

<script>
document.getElementById("leaveForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const application = {
        employeeName: document.getElementById("employeeName").value,
        position: document.getElementById("position").value,
        leaveType: document.getElementById("leaveType").value,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value,
        reason: document.getElementById("reason").value
    };

    localStorage.setItem("leaveApplication", JSON.stringify(application));

    alert("Application submitted and saved successfully!");
});

  function viewApplication() {
    const saved = localStorage.getItem("leaveApplication");

    alert(saved);
}

    if (!saved) {
        alert("No saved application found.");
        return;
    }

    const application = JSON.parse(saved);

    document.getElementById("employeeName").value = application.employeeName;
    document.getElementById("position").value = application.position;
    document.getElementById("leaveType").value = application.leaveType;
    document.getElementById("startDate").value = application.startDate;
    document.getElementById("endDate").value = application.endDate;
    document.getElementById("reason").value = application.reason;
}
</script>

</body>
</html>
