<!DOCTYPE html>
<html>
<head>
    <title>Leave Application</title>

    
</head>

<body>

    <h1>Leave Application Form</h1>

   <form onsubmit="submitForm(event)">

    <label>Employee Name:</label>
    <input type="text" id="employeeName">

    <br><br>

<label>Position:</label>
<input type="text" id="position">

    <br><br>

<label>Leave Type:</label>
<select id="leaveType">
    <option>Vacation Leave</option>
    <option>Sick Leave</option>
</select>

    <br><br>

<label>Start Date:</label>
<input type="date">

    <br><br>

<label>End Date:</label>
<input type="date" id="endDate">
    <br><br>

<label>Reason for Leave:</label><br>
<textarea id="reason" rows="4" cols="40"></textarea>

    <br><br>

<button type="submit">Submit Application</button>
        <button type="reset">Clear Form</button>

        <br><br>

<button type="button" onclick="viewApplication()">View Saved Application</button>

        </form>

    <script>
<script>
function submitForm(event) {
    event.preventDefault();

    let application = {
        employeeName: document.getElementById("employeeName").value,
        position: document.getElementById("position").value,
        leaveType: document.getElementById("leaveType").value,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value,
        reason: document.getElementById("reason").value
    };

    localStorage.setItem("leaveApplication", JSON.stringify(application));

    alert("Leave application saved successfully!");
}

function viewApplication() {
    let application = localStorage.getItem("leaveApplication");

    if (application) {
        let data = JSON.parse(application);

        alert(
            "Employee Name: " + data.employeeName +
            "\nPosition: " + data.position +
            "\nLeave Type: " + data.leaveType +
            "\nStart Date: " + data.startDate +
            "\nEnd Date: " + data.endDate +
            "\nReason: " + data.reason
        );
    } else {
        alert("No saved application found.");
    }
}
</script>

    
</body>
</html>
